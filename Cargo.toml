[package]
name = "metrics-opentelemetry"
# Major version is composed of <metrics><otel> versions
version = "0.24032.9"
edition = "2024"
rust-version = "1.85"
description = "Opentelemetry recorder for metrics crate"
readme = "README.md"
repository = "https://github.com/DoumanAsh/metrics-opentelemetry"
license = "BSL-1.0"
keywords = ["metrics", "opentelemetry"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md"
]

[features]
# Enables opentelemetry bound counters with improved performance
experimental_metrics_bound_instruments = ["opentelemetry/experimental_metrics_bound_instruments", "opentelemetry_sdk/experimental_metrics_bound_instruments"]

[dependencies.opentelemetry]
version = "0.32"
default-features = false
features = ["metrics"]

[dependencies.opentelemetry_sdk]
version = "0.32"
default-features = false
optional = true

[dependencies.metrics]
version = "0.24"
default-features = false

[dependencies.parking_lot]
version = "0.12"
default-features = false

[dependencies.portable-atomic]
version = "1"
default-features = false
features = ["float"]

[dev-dependencies.opentelemetry_sdk]
version = "0.32"
default-features = false
features = ["metrics", "testing"]
